org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---- CHER configuration (NOT secrets) -------------------------------------
# Backend the watch talks to. 10.0.2.2 is the host machine as seen from the Android emulator.
# Override per build:   ./gradlew assembleDebug -Pcher.serverUrl=http://192.168.1.20:3000
# or at runtime:        adb shell am start -n com.cher.watch/.MainActivity --es cher_server_url http://HOST:3000
cher.serverUrl=http://10.0.2.2:3100
# Optional device token (must match CHER_API_KEY on the server). Leave empty when the server has no key.
# Pass it on the command line (-Pcher.apiKey=...) or in ~/.gradle/gradle.properties; never commit it.
cher.apiKey=
cher.watchId=watch-1
